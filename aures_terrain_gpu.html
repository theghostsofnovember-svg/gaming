<script>
'use strict';
/* ================= utils ================= */
const $=id=>document.getElementById(id);
const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
const ss=(a,b,x)=>{const t=cl((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const S=1000,CH=16,CS=S/CH,WM=8000,MU=S/WM; /* 1 unit = 8 m ; MU = units per metre */
const U2W=u=>-S/2+u*S;
const MR=2048,RN=64,RDN=128,RVN=16,MAXG=600000,MAXF=90000;
const QS=new URLSearchParams(location.search);
['seed','res','q','hm','ero'].forEach(k=>{if(QS.has(k)&&$(k))$(k).value=QS.get(k)});
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
if(!renderer.capabilities.isWebGL2||!renderer.extensions.get('EXT_color_buffer_float')){$('msg').textContent='يتطلب WebGL2 + Float render targets';$('msg').style.display='block';throw 0}

/* ================= GPU compute helpers ================= */
const qs=new THREE.Scene(),qc=new THREE.OrthographicCamera(-1,1,1,-1,0,1),quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2));qs.add(quad);
const VQ='void main(){gl_Position=vec4(position.xy,0.,1.);}';
const SMP='uniform sampler2D uS;uniform float uN;vec4 S(vec2 c){return texture2D(uS,(clamp(c,vec2(0.),vec2(uN-1.))+.5)/uN);}';
const pm=(f,u)=>new THREE.ShaderMaterial({uniforms:u,vertexShader:VQ,fragmentShader:f,depthTest:false,depthWrite:false});
const mkRT=(n,f)=>new THREE.WebGLRenderTarget(n,n,{type:f?THREE.FloatType:THREE.UnsignedByteType,format:THREE.RGBAFormat,minFilter:f?THREE.NearestFilter:THREE.LinearFilter,magFilter:f?THREE.NearestFilter:THREE.LinearFilter,depthBuffer:false,stencilBuffer:false});
const pass=(m,rt)=>{quad.material=m;renderer.setRenderTarget(rt);renderer.render(qs,qc);renderer.setRenderTarget(null)};
const V4=n=>Array.from({length:n},()=>new THREE.Vector4());
const setArr=(u,pts)=>u.value.forEach((v,i)=>{const p=pts[Math.min(i,pts.length-1)];v.set(p[0],p[1],p[2]||0,p[3]||0)});

/* ---- shared GLSL ---- */
const GN=`vec2 hh(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.+2.*fract(sin(p)*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*f*(f*(f*6.-15.)+10.);i+=uSeed;
return mix(mix(dot(hh(i),f),dot(hh(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(hh(i+vec2(0,1)),f-vec2(0,1)),dot(hh(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}
float sm(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}
float fbm2(vec2 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*nz(p);p=p*2.03+vec2(17.1,9.3);a*=.5;}return s;}`;
/* nearest point on a polyline stored in a vec4 uniform array -> (distance, t 0..1, lerp(z), lerp(w)) */
const PL=(nm,n)=>`uniform vec4 ${nm}[${n}];
vec4 pl_${nm}(vec2 p){float bd=1e9,bt=0.;vec2 bz=vec2(0.);
for(int i=0;i<${n-1};i++){vec4 A=${nm}[i],B=${nm}[i+1];vec2 ba=B.xy-A.xy,pa=p-A.xy;float t=clamp(dot(pa,ba)/max(dot(ba,ba),1e-12),0.,1.);vec2 q=pa-ba*t;float d=dot(q,q);
if(d<bd){bd=d;bt=(float(i)+t)/${(n-1).toFixed(1)};bz=mix(A.zw,B.zw,t);}}
return vec4(sqrt(bd),bt,bz);}`;
const NO=`float hs(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float no(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
return mix(mix(mix(hs(i),hs(i+vec3(1,0,0)),f.x),mix(hs(i+vec3(0,1,0)),hs(i+vec3(1,1,0)),f.x),f.y),mix(mix(hs(i+vec3(0,0,1)),hs(i+vec3(1,0,1)),f.x),mix(hs(i+vec3(0,1,1)),hs(i+vec3(1,1,1)),f.x),f.y),f.z);}`;
const HB=`float HB(vec2 uv){vec2 t=clamp(uv,0.,1.)*(uN-1.),i=floor(t),f=fract(t),i1=min(i+1.,vec2(uN-1.));
float a=texture2D(uH,(i+.5)/uN).r,b=texture2D(uH,(vec2(i1.x,i.y)+.5)/uN).r,c=texture2D(uH,(vec2(i.x,i1.y)+.5)/uN).r,d=texture2D(uH,(i1+.5)/uN).r;
return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}`;
const SMF=`uniform sampler2D uSM;uniform mat4 uSMM;uniform float uSMOn,uSMR,uSMB;
float SMs(vec3 wp){if(uSMOn<.5)return 1.;vec3 p=(uSMM*vec4(wp,1.)).xyz*.5+.5;
if(p.x<=0.||p.y<=0.||p.x>=1.||p.y>=1.||p.z>=1.)return 1.;float sh=0.,tx=1./uSMR;
for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++)sh+=step(p.z-uSMB,texture2D(uSM,p.xy+vec2(float(x),float(y))*tx).r);
vec2 e=min(p.xy,1.-p.xy);return mix(1.,sh/9.,smoothstep(0.,.07,min(e.x,e.y)));}`;
const AC='vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}';
const FOG=`float hf=1.+(1.-clamp(vP.y/uHs*2.,0.,1.))*1.5;float fgf=1.-exp(-dist*uFog*hf);
vec3 fc=mix(uHor,uSunCol*.35,pow(max(dot(-V,uSun),0.),6.)*.6);col=mix(col,fc,fgf);col=pow(aces(col),vec3(1./2.2));`;
const LITU='uniform vec3 uSun,uSunCol,uHor,uZen;uniform float uHs,uFog,uAmb,uN,uT,uNight,uMist;';
/* planar (anti-tiling, two scales) and triplanar texture sampling; returns linear albedo + world-space normal offset */
const TXF=`vec3 TX(sampler2D sd,sampler2D sn,vec2 uv,float bm,out vec3 pn){vec2 u2=mat2(.8,.6,-.6,.8)*uv*.37+.29;
vec3 a=mix(texture2D(sd,uv).rgb,texture2D(sd,u2).rgb,bm);vec2 n=mix(texture2D(sn,uv).rg,texture2D(sn,u2).rg,bm)*2.-1.;pn=vec3(n.x,0.,n.y);return pow(a,vec3(2.2));}
vec3 TRI(sampler2D sd,sampler2D sn,vec3 p,vec3 n,out vec3 pn){vec3 w=pow(abs(n),vec3(4.));w/=w.x+w.y+w.z+1e-5;
vec3 ax=texture2D(sd,p.zy).rgb,ay=texture2D(sd,p.xz).rgb,az=texture2D(sd,p.xy).rgb;
vec2 nx=texture2D(sn,p.zy).rg*2.-1.,ny=texture2D(sn,p.xz).rg*2.-1.,nz=texture2D(sn,p.xy).rg*2.-1.;
pn=vec3(0.,nx.y,nx.x)*w.x+vec3(ny.x,0.,ny.y)*w.y+vec3(nz.x,nz.y,0.)*w.z;return pow(ax*w.x+ay*w.y+az*w.z,vec3(2.2));}`;
/* normal mapping without tangents (screen-space cotangent frame) */
const PN=`vec3 PN(vec3 N,vec3 p,vec2 uv,vec3 m){vec3 q0=dFdx(p),q1=dFdy(p);vec2 s0=dFdx(uv),s1=dFdy(uv);vec3 S=q0*s1.t-q1*s0.t,T=-q0*s1.s+q1*s0.s;float l=max(dot(S,S),dot(T,T));if(l<1e-24)return N;float k=inversesqrt(l);return normalize(S*k*m.x+T*k*m.y+N*max(m.z,.3));}`;
/* drifting mist band on the mid slopes */
const MIST=`{float mz=exp(-pow((vP.y-uHs*.4)/(uHs*.15),2.));float mp=sin(vP.x*.011+uT*.03)*sin(vP.z*.013-uT*.02)+.6*sin((vP.x-vP.z)*.006+1.7)+.35*sin(vP.x*.031+vP.z*.027+uT*.05);
float mst=uMist*mz*smoothstep(.15,1.1,mp)*smoothstep(60.,420.,dist)*(1.-smoothstep(.2,.55,abs(V.y)));col=mix(col,mix(uHor,vec3(1.),.2)*uAmb*.9,clamp(mst,0.,.55));}`;

/* ================= terrain generation passes ================= */
const baseM=pm(`uniform float uN,uMt;uniform vec2 uSeed;uniform vec4 uVh,uOP,uPl,uPn,uDp,uMs;
${GN}${PL('uRiv',RN)}${PL('uRv0',RVN)}${PL('uRv1',RVN)}${PL('uRv2',RVN)}${PL('uRv3',RVN)}
float ridged(vec2 uv){float wx=uv.x*3.+nz(vec2(uv.x*2.+7.,uv.y*2.))*.5,wy=uv.y*3.+nz(vec2(uv.x*2.,uv.y*2.+13.))*.5;
float s=0.,a=1.,f=1.,w=1.,n=0.;for(int i=0;i<9;i++){float nn=nz(vec2(wx,wy)*f)*1.6;float q=clamp(1.-sqrt(nn*nn+.05)+.2236,0.,1.);q*=q;q*=w;w=clamp(q*2.,0.,1.);s+=q*a;n+=a;f*=2.05;a*=.45;}return s/n;}
float rav(vec4 r,vec2 uv){float d=r.x+nz(uv*70.)*.0012;return r.z*pow(1.-sm(0.,r.w,d),1.7)*sm(0.,.05,r.y);}
void main(){vec2 uv=floor(gl_FragCoord.xy)/(uN-1.);
vec2 w=uv+vec2(nz(uv*3.+vec2(7.,0.)),nz(uv*3.+vec2(0.,13.)))*.035;
float hills=fbm2(w*5.)*.5+.5,rg=ridged(w);
vec2 q=abs(uv-.5);float bm=max(q.x,q.y)+nz(uv*4.+3.)*.07+nz(uv*11.+1.)*.02;
float mm=sm(.28,.47,bm);mm=max(mm,sm(1.,0.,length(uv-uMs.xy)/uMs.z)*uMs.w);
float h=.15+.12*hills+.05*rg;
h+=mm*uMt*(.16+.66*rg*(.55+.45*hills));
h+=uVh.w*exp(-dot(uv-uVh.xy,uv-uVh.xy)/(uVh.z*uVh.z));
h+=uOP.w*exp(-dot(uv-uOP.xy,uv-uOP.xy)/(uOP.z*uOP.z));
/* plateau / mesa with stepped escarpment */
float pr=length(uv-uPl.xy)/uPl.z+nz(uv*9.+31.)*.10+nz(uv*27.+5.)*.025;
float mt=sm(1.12,.88,pr);float tq=(floor(mt*3.)+sm(.5,1.,fract(mt*3.)))/3.;
h=mix(h,uPl.w+.012*nz(uv*14.)+.004*rg,tq);
/* plain */
float pn=length(uv-uPn.xy)/uPn.z+nz(uv*6.+50.)*.15;
h=mix(h,uPn.w+.015*hills,sm(1.,.45,pn)*(1.-.75*mm));
/* depression basin */
float dr=length(uv-uDp.xy)/uDp.z+nz(uv*8.+70.)*.12;
h=mix(h,uDp.w+.05*dr*dr,sm(1.2,.25,dr)*(1.-.5*mm));
/* ravines (shi'ab) */
h-=rav(pl_uRv0(uv),uv)+rav(pl_uRv1(uv),uv)+rav(pl_uRv2(uv),uv)+rav(pl_uRv3(uv),uv);
/* river valley: wide floor, gorge between village and plateau */
vec4 rv=pl_uRiv(uv);float d=rv.x+nz(uv*30.)*.004+nz(uv*90.)*.001;
float lvl=mix(.12,.035,rv.y)+.004*nz(uv*20.);
h=min(h,mix(lvl,h,pow(sm(rv.z,rv.w,d),1.25)));
gl_FragColor=vec4(h,0.,0.,0.);}`,{uN:{value:0},uMt:{value:1},uSeed:{value:new THREE.Vector2()},uVh:{value:new THREE.Vector4()},uOP:{value:new THREE.Vector4()},uPl:{value:new THREE.Vector4()},uPn:{value:new THREE.Vector4()},uDp:{value:new THREE.Vector4()},uMs:{value:new THREE.Vector4()},
 uRiv:{value:V4(RN)},uRv0:{value:V4(RVN)},uRv1:{value:V4(RVN)},uRv2:{value:V4(RVN)},uRv3:{value:V4(RVN)}});
const normM=pm(SMP+`uniform float uMn,uMx,uHm,uMode,uDs,uWs;
void main(){vec2 c=floor(gl_FragCoord.xy);vec4 s=S(c);float h=(s.r-uMn)/(uMx-uMn);
if(uMode<.5)gl_FragColor=vec4(h*uHm,0.,0.,0.);
else gl_FragColor=vec4(h,clamp(s.a*uDs,0.,1.),clamp(s.g*uWs,0.,1.),1.);}`,{uS:{value:null},uN:{value:0},uMn:{value:0},uMx:{value:1},uHm:{value:1},uMode:{value:0},uDs:{value:1},uWs:{value:1}});
const thM=pm(SMP+`uniform float uT;
void main(){vec2 c=floor(gl_FragCoord.xy);vec4 s=S(c);float dl=0.,dp=0.;
for(int i=0;i<4;i++){vec2 o=i==0?vec2(1,0):i==1?vec2(-1,0):i==2?vec2(0,1):vec2(0,-1);
float d=s.r-S(c+o).r;float m=d>uT?-.12*(d-uT):(d<-uT?.12*(-d-uT):0.);dl+=m;if(m>0.)dp+=m;}
s.r+=dl;s.a+=dp;gl_FragColor=s;}`,{uS:{value:null},uN:{value:0},uT:{value:1}});
/* grid hydraulic erosion (gather form, mass conserving) */
const hydM=pm(SMP+`uniform float uCell,uKc,uRain;
vec4 R(vec2 c){vec4 v=S(c);v.g+=uRain;return v;}
